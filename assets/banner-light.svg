<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d"><title id="t">nahuya: the over-engineering reviewer for Claude Code</title><desc id="d">The nahuya wordmark. Beside it, before and after: eleven lines of Rust (a Parity trait, its only implementation, and a factory that returns it boxed) just to ask parity.is_even(n) become one line, if n % 2 == 0, because the trait has one implementation and one caller. Chips: 21,901 lines reviewed, 190 lines net removed, 218 of 218 game tests green.</desc><defs><radialGradient id="g" cx="0.22" cy="0.45" r="0.6"><stop offset="0" stop-color="#f6e3db"/><stop offset="1" stop-color="#faf9f7"/></radialGradient></defs><rect width="1280" height="420" rx="24" fill="url(#g)"/><text x="68" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="124" font-weight="800" letter-spacing="-4" fill="#1c1917" textLength="392" lengthAdjust="spacingAndGlyphs">nahuya</text><text x="468" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="124" font-weight="800" fill="#d97757">?</text><text x="74" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#57534e">Russian slang for “what the hell is this for?”</text><text x="74" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1c1917">The over-engineering reviewer for Claude Code.</text><text x="74" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#57534e">Proves before it cuts. Reviews before you push.</text><rect x="716" y="17.2" width="520" height="341.5" rx="14" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/><text x="736" y="43.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe 