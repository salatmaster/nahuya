<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d"><title id="t">How the nahuya pre-push review works</title><desc id="d">Claude runs git push. The gate counts unreviewed lines; under the threshold the push goes through. Over it, the push is blocked and the polish loop starts: a fresh read-only reviewer proposes findings, Claude verifies each one and applies it, rejects it with evidence (a judge settles confident disputes), or asks you. Checks run after each round, later rounds audit the fixes for lost behavior, and the loop ends with a cleanup commit and the push.</desc><defs><marker id="ah-6f6b65" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6b65"/></marker><marker id="ah-4eba65" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4eba65"/></marker><marker id="ah-ff6b80" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6b80"/></marker><marker id="ah-e5c07b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5c07b"/></marker><marker id="ah-e0896c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e0896c"/></marker></defs><rect width="1280" height="640" rx="24" fill="#141413"/><rect x="40" y="70" width="220" height="120" rx="14" fill="#1f1e1d" stroke="#34322f" stroke-width="1.5"/><circle cx="68" cy="100" r="13" fill="#3a2721"/><text x="68" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e0896c" text-anchor="middle">1</text><text x="92" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f4f2ee" text-anchor="start">Claude пушит</text><rect x="62" y="134" width="77" height="23" rx="6" fill="#2a2826"/><text x="69" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#f4f2ee" text-anchor="start">git push</text><rect x="150" y="134" width="109" height="23" rx="6" fill="#2a2826"/><text x="157" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#f4f2ee" text-anchor="start">gh pr create</text><rect x="320" y="70" width="270" height="120" rx="14" fill="#1f1e1d" stroke="#34322f" stroke-width="1.5"/><circle cx="348" cy="100" r="13" fill="#3a2721"/><text x="348" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e0896c" text-anchor="middle">2</text><text x="372" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f4f2ee" text-anchor="start">Гейт считает</text><text x="348" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">новые строки с прошлого ревью,</text><text x="348" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">без тестов и генерёнки</text><path d="M262 130 H316" fill="none" stroke="#6f6b65" stroke-width="2" marker-end="url(#ah-6f6b65)"/><path d="M455 68 V36 H700" fill="none" stroke="#4eba65" stroke-width="2" marker-end="url(#ah-4eba65)"/><text x="470" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#b4b0aa" text-anchor="start">меньше порога</text><rect x="704" y="14" width="190" height="42" rx="21" fill="#1b2e21" stroke="#1b2e21" stroke-width="1.5"/><text x="799" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#4eba65" text-anchor="middle">пуш проходит</text><path d="M592 130 H650" fill="none" stroke="#e0896c" stroke-width="2" marker-end="url(#ah-e0896c)"/><text x="598" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e0896c" text-anchor="start">больше</text><rect x="654" y="70" width="290" height="120" rx="14" fill="#3a2721" stroke="#e0896c" stroke-width="1.5"/><circle cx="682" cy="100" r="13" fill="#3a2721"/><text x="682" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e0896c" text-anchor="middle">3</text><text x="706" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f4f2ee" text-anchor="start">Пуш стоп, начинается цикл</text><text x="682" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">свежий ревьюер видит только</text><text x="682" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">дифф, журнал и ваш запрос</text><text x="682" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#e0896c" text-anchor="start">только чтение: Read, Grep, Glob</text><path d="M946 130 H1000" fill="none" stroke="#6f6b65" stroke-width="2" marker-end="url(#ah-6f6b65)"/><rect x="1004" y="70" width="236" height="120" rx="14" fill="#1f1e1d" stroke="#34322f" stroke-width="1.5"/><circle cx="1032" cy="100" r="13" fill="#3a2721"/><text x="1032" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e0896c" text-anchor="middle">4</text><text x="1056" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f4f2ee" text-anchor="start">Claude проверяет</text><text x="1032" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">каждую находку, повторяя</text><text x="1032" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">решающий поиск сам</text><path d="M1122 192 V232 M700 232 H1140" fill="none" stroke="#6f6b65" stroke-width="2"/><path d="M700 232 V264" fill="none" stroke="#4eba65" stroke-width="2" marker-end="url(#ah-4eba65)"/><path d="M920 232 V264" fill="none" stroke="#ff6b80" stroke-width="2" marker-end="url(#ah-ff6b80)"/><path d="M1140 232 V264" fill="none" stroke="#e5c07b" stroke-width="2" marker-end="url(#ah-e5c07b)"/><rect x="600" y="270" width="200" height="132" rx="14" fill="#1b2e21" stroke="#1b2e21" stroke-width="1.5"/><text x="618" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#4eba65" text-anchor="start">Подтвердилась</text><text x="618" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b0aa" text-anchor="start">правит код и вызовы,</text><text x="618" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b0aa" text-anchor="start">гоняет проверку,</text><text x="618" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b0aa" text-anchor="start">откатывает сломанное</text><rect x="820" y="270" width="200" height="132" rx="14" fill="#3a1d24" stroke="#3a1d24" stroke-width="1.5"/><text x="838" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ff6b80" text-anchor="start">Отклонена с пруфом</text><text x="838" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b0aa" text-anchor="start">file:line, тест</text><text x="838" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b0aa" text-anchor="start">или ваш запрос; спор</text><text x="838" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b0aa" text-anchor="start">решает арбитр</text><rect x="1040" y="270" width="200" height="132" rx="14" fill="#352d1c" stroke="#352d1c" stroke-width="1.5"/><text x="1058" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#e5c07b" text-anchor="start">Непонятно</text><text x="1058" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b0aa" text-anchor="start">needs-context:</text><text x="1058" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b0aa" text-anchor="start">код не трогаем,</text><text x="1058" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b0aa" text-anchor="start">вопрос идёт к вам</text><rect x="40" y="270" width="500" height="132" rx="14" fill="#1f1e1d" stroke="#34322f" stroke-width="1.5"/><circle cx="68" cy="300" r="13" fill="#3a2721"/><text x="68" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e0896c" text-anchor="middle">5</text><text x="92" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f4f2ee" text-anchor="start">Следующий раунд проверяет правки</text><text x="68" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">Для каждой удалённой строки: какую проверку, валидацию или</text><text x="68" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">обработку ошибки она несла и есть ли это в новом коде?</text><text x="68" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">Потерянное возвращается как lost-behavior, первым делом.</text><path d="M600 336 H544" fill="none" stroke="#6f6b65" stroke-width="2" marker-end="url(#ah-6f6b65)"/><path d="M290 268 V214 H660 V194" fill="none" stroke="#e0896c" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ah-e0896c)"/><text x="306" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e0896c" text-anchor="start">есть новые находки и раунды: ещё один свежий ревьюер</text><path d="M290 404 V452" fill="none" stroke="#6f6b65" stroke-width="2" marker-end="url(#ah-6f6b65)"/><text x="304" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#b4b0aa" text-anchor="start">ничего нового или кончились max-rounds</text><rect x="40" y="456" width="1200" height="130" rx="14" fill="#1f1e1d" stroke="#34322f" stroke-width="1.5"/><circle cx="68" cy="486" r="13" fill="#3a2721"/><text x="68" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e0896c" text-anchor="middle">6</text><text x="92" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f4f2ee" text-anchor="start">Коммит с чисткой, потом пуш</text><text x="68" y="523" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">Правки ложатся новым коммитом поверх вашего; запушенная история не переписывается.</text><text x="68" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b4b0aa" text-anchor="start">В отчёте: что применено, что изменило поведение, что отклонено и почему, что ждёт вашего решения.</text><rect x="68" y="556.5" width="98" height="22.5" rx="6" fill="#2a2826"/><text x="75" y="572" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#f4f2ee" text-anchor="start">nahuya mark</text><rect x="178" y="556.5" width="75" height="22.5" rx="6" fill="#2a2826"/><text x="185" y="572" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#f4f2ee" text-anchor="start">git push</text><text x="1210" y="572" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#77736d" text-anchor="end">пропустить ревью: /nahuya:skip</text></svg>
