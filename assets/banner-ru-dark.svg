<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d"><title id="t">nahuya: the over-engineering reviewer for Claude Code</title><desc id="d">The nahuya wordmark. Beside it, before and after: eleven lines of Rust (a Parity trait, its only implementation, and a factory that returns it boxed) just to ask parity.is_even(n) become one line, if n % 2 == 0, because the trait has one implementation and one caller. Chips: 21,901 lines reviewed, 190 lines net removed, 218 of 218 game tests green.</desc><defs><radialGradient id="g" cx="0.22" cy="0.45" r="0.6"><stop offset="0" stop-color="#2c1f1a"/><stop offset="1" stop-color="#141413"/></radialGradient></defs><rect width="1280" height="420" rx="24" fill="url(#g)"/><text x="70" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="-3" fill="#f4f2ee" textLength="150" lengthAdjust="spacingAndGlyphs">на</text><path d="M235.0 158.0L301.0 158.0 M239.4 141.5L296.6 174.5 M251.5 129.4L284.5 186.6 M268.0 125.0L268.0 191.0 M284.5 129.4L251.5 186.6 M296.6 141.5L239.4 174.5" stroke="#d97757" stroke-width="10" stroke-linecap="round"/><text x="322" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="-3" fill="#f4f2ee" textLength="148" lengthAdjust="spacingAndGlyphs">уя</text><text x="478" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="800" fill="#d97757">?</text><text x="74" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#b4b0aa">nahuya — тот самый вопрос к каждой лишней строке</text><text x="74" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f2ee">Ревьюер оверинжиниринга для Claude Code.</text><text x="74" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#b4b0aa">Сначала доказывает, потом режет. Ревью до пуша.</text><rect x="716" y="17.2" width="520" height="341.5" rx="14" fill="#1f1e1d" stroke="#34322f" stroke-width="1.5"/><text x="736" y="43.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#ff8fa3">БЫЛО · 11 СТРОК</text><rect x="728" y="51.2" width="496" height="193.5" rx="8" fill="#3a1d24"/><text x="742" y="69.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#c792ea">trait</tspan> <tspan fill="#7fd1c7">Parity</tspan> <tspan fill="#a8a29e">{</tspan> <tspan fill="#c792ea">fn</tspan> <tspan fill="#82aaff">is_even</tspan><tspan fill="#a8a29e">(</tspan><tspan fill="#a8a29e">&amp;</tspan><tspan fill="#c792ea">self</tspan><tspan fill="#a8a29e">,</tspan> <tspan fill="#f4f2ee">n</tspan><tspan fill="#a8a29e">:</tspan> <tspan fill="#7fd1c7">i64</tspan><tspan fill="#a8a29e">)</tspan> <tspan fill="#a8a29e">-&gt;</tspan> <tspan fill="#7fd1c7">bool</tspan><tspan fill="#a8a29e">;</tspan> <tspan fill="#a8a29e">}</tspan></text><text x="742" y="85.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#c792ea">struct</tspan> <tspan fill="#7fd1c7">ModParity</tspan><tspan fill="#a8a29e">;</tspan></text><text x="742" y="102.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#c792ea">impl</tspan> <tspan fill="#7fd1c7">Parity</tspan> <tspan fill="#c792ea">for</tspan> <tspan fill="#7fd1c7">ModParity</tspan> <tspan fill="#a8a29e">{</tspan></text><text x="742" y="118.8" 